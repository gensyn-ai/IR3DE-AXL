<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="460" height="80" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="460" height="80" fill="#ffffff"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#333333"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="180" height="40" rx="8" fill="#eef2ff" stroke="#333333" stroke-width="1.5"/>
